<!DOCTYPE html>
<html>
<head>
    <title>Jump Master!</title>
    <style>
        body { text-align: center; font-family: Arial; }
        canvas { background: #f0f0f0; border: 2px solid #333; display: block; margin: 20px auto; }
    </style>
</head>
<body>
    <h1>Jump Master!</h1>
    <p>กดคลิกหน้าจอเพื่อกระโดด!</p>
    <canvas id="gameCanvas" width="400" height="200"></canvas>
    <div id="score">คะแนน: 0</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        let player = { x: 50, y: 150, w: 30, h: 30, dy: 0, jump: false };
        let obstacle = { x: 400, y: 160, w: 20, h: 40 };
        let score = 0;

        function update() {
            // ระบบกระโดด
            if (player.jump) {
                player.dy = -8;
                player.jump = false;
            }
            player.dy += 0.5; // แรงโน้มถ่วง
            player.y += player.dy;
            if (player.y > 150) { player.y = 150; player.dy = 0; }

            // อุปสรรควิ่งมา
            obstacle.x -= 5;
            if (obstacle.x < -20) { obstacle.x = 400; score++; }

            // เช็กชน
            if (player.x < obstacle.x + obstacle.w && player.x + player.w > obstacle.x && player.y + player.h > obstacle.y) {
                alert("Game Over! คะแนนของคุณ: " + score);
                score = 0; obstacle.x = 400;
            }
            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "blue";
            ctx.fillRect(player.x, player.y, player.w, player.h); // ตัวละคร
            ctx.fillStyle = "red";
            ctx.fillRect(obstacle.x, obstacle.y, obstacle.w, obstacle.h); // อุปสรรค
            document.getElementById("score").innerText = "คะแนน: " + score;
        }

        canvas.addEventListener("click", () => { if (player.y === 150) player.jump = true; });
        update();
    </script>
</body>
</html>
