<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roblox 3D Obby Pro</title>
    <style>
        * { touch-action: none; user-select: none; }
        body { margin: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
        
        #orientNotice {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); color: white; z-index: 9999;
            justify-content: center; align-items: center; text-align: center; font-size: 20px;
        }
        @media screen and (orientation: portrait) { #orientNotice { display: flex; } }

        /* UI Layer */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* Joystick Base */
        #joystick-zone { position: absolute; bottom: 30px; left: 40px; width: 120px; height: 120px; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; pointer-events: auto; }
        #joystick-stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255,255,255,0.8); border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        
        /* Jump Button */
        #jump-btn { position: absolute; bottom: 40px; right: 50px; width: 80px; height: 80px; background: rgba(255, 71, 87, 0.85); border: 3px solid #fff; border-radius: 50%; color: white; font-weight: bold; font-size: 18px; pointer-events: auto; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        #jump-btn:active { background: rgba(255, 71, 87, 1); transform: scale(0.95); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="orientNotice">📱 กรุณาเอียงมือถือเป็น "แนวนอน" เพื่อเล่นครับ!</div>

    <div class="ui-layer">
        <div id="joystick-zone"><div id="joystick-stick"></div></div>
        <div id="jump-btn">JUMP</div>
    </div>

    <script>
        // 1. Scene & Camera Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x74b9ff);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(20, 40, 20);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x888888));

        // 2. Build Obby Course
        function createBox(x, y, z, w, h, d, color) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshPhongMaterial({ color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            return mesh;
        }

        // Platforms
        createBox(0, -0.5, 0, 8, 1, 8, 0x2ed573);    // Start
        createBox(0, -0.5, -10, 3, 1, 3, 0xffa500);  // Step 1
        createBox(0, 0.5, -18, 3, 1, 3, 0xffa500);   // Step 2
        createBox(0, 1.5, -26, 3, 1, 3, 0xffa500);   // Step 3
        createBox(0, 2.5, -36, 10, 1, 10, 0x9b59b6); // Checkpoint
        createBox(0, 2.5, -48, 2, 1, 8, 0x34495e);  // Lava Bridge (Narrow)
        createBox(0, 3.5, -60, 8, 1, 8, 0xf1c40f);  // Goal

        // 3. Create Roblox Character (Blocky Humanoid)
        const playerGroup = new THREE.Group();
        
        // Head
        const head = createBox(0, 1.5, 0, 0.6, 0.6, 0.6, 0xffcc99);
        // Body
        const torso = createBox(0, 0.8, 0, 0.7, 0.8, 0.4, 0x0984e3);
        // Arms
        const leftArm = createBox(-0.55, 0.8, 0, 0.3, 0.8, 0.3, 0xd63031);
        const rightArm = createBox(0.55, 0.8, 0, 0.3, 0.8, 0.3, 0xd63031);
        // Legs
        const leftLeg = createBox(-0.2, 0.1, 0, 0.3, 0.7, 0.3, 0x2d3436);
        const rightLeg = createBox(0.2, 0.1, 0, 0.3, 0.7, 0.3, 0x2d3436);

        playerGroup.add(head, torso, leftArm, rightArm, leftLeg, rightLeg);
        playerGroup.position.set(0, 0.5, 0);
        scene.add(playerGroup);

        // Controls Logic
        let joyX = 0, joyY = 0;
        let camYaw = 0, camPitch = 0.3;
        let velocityY = 0, isGrounded = true;

        // Joystick Control
        const zone = document.getElementById('joystick-zone');
        const stick = document.getElementById('joystick-stick');
        let joyTouchId = null;

        zone.addEventListener('touchstart', (e) => {
            const touch = e.changedTouches[0];
            joyTouchId = touch.identifier;
        });

        window.addEventListener('touchmove', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === joyTouchId) {
                    const rect = zone.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    
                    let dx = touch.clientX - centerX;
                    let dy = touch.clientY - centerY;
                    const dist = Math.min(Math.hypot(dx, dy), 45);
                    const angle = Math.atan2(dy, dx);

                    joyX = (Math.cos(angle) * dist) / 45;
                    joyY = (Math.sin(angle) * dist) / 45;

                    stick.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
                }
            }
        });

        const resetJoy = () => {
            joyX = 0; joyY = 0;
            stick.style.transform = `translate(0px, 0px)`;
            joyTouchId = null;
        };
        window.addEventListener('touchend', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === joyTouchId) resetJoy();
            }
        });

        // Touch Look (Swipe Right Screen to Rotate Camera)
        let lookTouchId = null, lastTouchX = 0, lastTouchY = 0;
        window.addEventListener('touchstart', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.clientX > window.innerWidth / 2 && lookTouchId === null) {
                    lookTouchId = touch.identifier;
                    lastTouchX = touch.clientX;
                    lastTouchY = touch.clientY;
                }
            }
        });

        window.addEventListener('touchmove', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === lookTouchId) {
                    const dx = touch.clientX - lastTouchX;
                    const dy = touch.clientY - lastTouchY;
                    
                    camYaw -= dx * 0.005;
                    camPitch = Math.max(0.1, Math.min(1.2, camPitch + dy * 0.005));

                    lastTouchX = touch.clientX;
                    lastTouchY = touch.clientY;
                }
            }
        });

        window.addEventListener('touchend', (e) => {
            for (let touch of e.changedTouches) {
                if (touch.identifier === lookTouchId) lookTouchId = null;
            }
        });

        // Jump
        document.getElementById('jump-btn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (isGrounded) { velocityY = 0.22; isGrounded = false; }
        });

        // Main Loop
        function animate() {
            requestAnimationFrame(animate);

            // Movement logic relative to Camera Angle
            if (Math.abs(joyX) > 0.1 || Math.abs(joyY) > 0.1) {
                const moveAngle = Math.atan2(joyX, joyY);
                const moveSpeed = 0.12;

                playerGroup.position.x -= Math.sin(camYaw + moveAngle) * moveSpeed;
                playerGroup.position.z -= Math.cos(camYaw + moveAngle) * moveSpeed;

                playerGroup.rotation.y = camYaw + moveAngle + Math.PI;
            }

            // Gravity & Jump Physics
            playerGroup.position.y += velocityY;
            if (playerGroup.position.y > 0.5) {
                velocityY -= 0.01;
                isGrounded = false;
            } else {
                playerGroup.position.y = 0.5;
                velocityY = 0;
                isGrounded = true;
            }

            // Respawn if Fallen
            if (playerGroup.position.y < -10) {
                playerGroup.position.set(0, 0.5, 0);
            }

            // Camera Tracking
            const camDist = 6;
            camera.position.x = playerGroup.position.x + Math.sin(camYaw) * Math.cos(camPitch) * camDist;
            camera.position.z = playerGroup.position.z + Math.cos(camYaw) * Math.cos(camPitch) * camDist;
            camera.position.y = playerGroup.position.y + Math.sin(camPitch) * camDist + 1;
            camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
