<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roblox Pro Obby 100%</title>
    <style>
        * { touch-action: none; user-select: none; }
        body { margin: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
        
        /* สไตล์มือถือเหมือน Roblox */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        #joystick-zone { position: absolute; bottom: 30px; left: 40px; width: 120px; height: 120px; background: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; pointer-events: auto; }
        #joystick-stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255,255,255,0.8); border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.3); }
        
        #jump-btn { position: absolute; bottom: 40px; right: 50px; width: 80px; height: 80px; background: rgba(255, 71, 87, 0.9); border: 3px solid #fff; border-radius: 50%; pointer-events: auto; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.4); font-weight: bold; color: white; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div class="ui-layer">
        <div id="joystick-zone"><div id="joystick-stick"></div></div>
        <div id="jump-btn">JUMP</div>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 5);
        scene.add(light);

        // --- ระบบสร้างด่าน (Obby ยาวๆ) ---
        const platforms = [];
        function addBlock(x, y, z, w, d, color) {
            const geo = new THREE.BoxGeometry(w, 1, d);
            const mat = new THREE.MeshPhongMaterial({ color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.userData = { w, d };
            scene.add(mesh);
            platforms.push(mesh);
        }

        // วางบล็อกยาวต่อเนื่อง
        for(let i = 0; i < 20; i++) {
            addBlock(0, 0, -i * 6, 6, 6, i % 2 === 0 ? 0x2ed573 : 0xffa500);
        }
        addBlock(0, 0, -126, 10, 10, 0x9b59b6); // จุดจบ

        // --- สร้างตัวละคร (ใส่รายละเอียดเสื้อผ้า) ---
        const player = new THREE.Group();
        const createPart = (w, h, d, col, x, y, z) => {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshPhongMaterial({color: col}));
            m.position.set(x,y,z); return m;
        }

        const head = createPart(0.6, 0.6, 0.6, 0xffdbac, 0, 1.5, 0);
        const hair = createPart(0.65, 0.2, 0.65, 0x331a00, 0, 1.8, 0);
        const torso = createPart(0.7, 0.8, 0.4, 0x1e90ff, 0, 0.8, 0); // เสื้อ
        const shirtDetail = createPart(0.3, 0.3, 0.1, 0xffffff, 0, 0.9, -0.21); // โลโก้เสื้อ
        const lArm = createPart(0.25, 0.7, 0.25, 0x1e90ff, -0.5, 0.8, 0); // แขนเสื้อ
        const rArm = createPart(0.25, 0.7, 0.25, 0x1e90ff, 0.5, 0.8, 0);
        const lLeg = createPart(0.3, 0.7, 0.3, 0x2f3640, -0.2, 0, 0); // กางเกง
        const rLeg = createPart(0.3, 0.7, 0.3, 0x2f3640, 0.2, 0, 0);
        
        player.add(head, hair, torso, shirtDetail, lArm, rArm, lLeg, rLeg);
        scene.add(player);

        // --- Logic ควบคุม (แก้ Rotation ให้เป๊ะ) ---
        let joyX = 0, joyY = 0, camYaw = 0, playerAngle = 0, velocityY = 0;
        let isGrounded = false;
        let pos = new THREE.Vector3(0, 5, 0);

        // Joystick
        const zone = document.getElementById('joystick-zone');
        zone.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            const rect = zone.getBoundingClientRect();
            joyX = (touch.clientX - (rect.left + 60)) / 60;
            joyY = (touch.clientY - (rect.top + 60)) / 60;
        });
        zone.addEventListener('touchend', () => { joyX = 0; joyY = 0; });

        // Camera Swipe
        let lastX = 0;
        window.addEventListener('touchmove', (e) => {
            if(e.touches[0].clientX > window.innerWidth/2) {
                camYaw += (e.touches[0].clientX - lastX) * 0.01;
            }
            lastX = e.touches[0].clientX;
        });
        window.addEventListener('touchstart', (e) => lastX = e.touches[0].clientX);

        // Jump
        document.getElementById('jump-btn').addEventListener('touchstart', () => {
            if(isGrounded) { velocityY = 0.2; isGrounded = false; }
        });

        function animate() {
            requestAnimationFrame(animate);

            // เดินตามกล้อง
            if(Math.abs(joyX) > 0.1 || Math.abs(joyY) > 0.1) {
                const moveAngle = Math.atan2(joyX, joyY) + camYaw;
                pos.x += Math.sin(moveAngle) * 0.15;
                pos.z += Math.cos(moveAngle) * 0.15;
                player.rotation.y = moveAngle;
            }

            // แรงโน้มถ่วง
            velocityY -= 0.015;
            pos.y += velocityY;

            // ชนพื้น
            isGrounded = false;
            platforms.forEach(p => {
                if(pos.x > p.position.x - p.userData.w/2 && pos.x < p.position.x + p.userData.w/2 &&
                   pos.z > p.position.z - p.userData.d/2 && pos.z < p.position.z + p.userData.d/2 &&
                   pos.y < p.position.y + 0.5 && pos.y > p.position.y - 0.5) {
                    pos.y = p.position.y + 0.5; velocityY = 0; isGrounded = true;
                }
            });

            // ตกเหว
            if(pos.y < -10) pos.set(0, 5, 0);

            // อัปเดตตำแหน่ง
            player.position.copy(pos);
            camera.position.set(pos.x - Math.sin(camYaw)*8, pos.y + 5, pos.z - Math.cos(camYaw)*8);
            camera.lookAt(pos.x, pos.y, pos.z);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
