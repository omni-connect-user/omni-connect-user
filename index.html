<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    
    // ตั้งค่าตัวละคร
    let player = { x: 50, y: 150, w: 30, h: 30, dy: 0, jump: false, grounded: true };
    let obstacle = { x: 400, y: 150, w: 20, h: 40 };
    let score = 0;
    let gameSpeed = 6; // ปรับความเร็วตรงนี้ได้เลย (ยิ่งเยอะยิ่งเร็ว)

    function update() {
        // แรงโน้มถ่วง
        player.dy += 0.8; 
        player.y += player.dy;

        if (player.y > 150) {
            player.y = 150;
            player.dy = 0;
            player.grounded = true;
        }

        // อุปสรรคเลื่อน
        obstacle.x -= gameSpeed;
        if (obstacle.x < -20) {
            obstacle.x = canvas.width;
            score++;
            gameSpeed += 0.1; // ความยากจะค่อยๆ เพิ่มขึ้น
        }

        // เช็กการชน (ตัดความหน่วงออก)
        if (player.x < obstacle.x + obstacle.w && 
            player.x + player.w > obstacle.x && 
            player.y + player.h > obstacle.y) {
            alert("Game Over! คะแนน: " + score);
            score = 0;
            gameSpeed = 6;
            obstacle.x = canvas.width;
        }

        draw();
        requestAnimationFrame(update);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "blue";
        ctx.fillRect(player.x, player.y, player.w, player.h);
        ctx.fillStyle = "red";
        ctx.fillRect(obstacle.x, obstacle.y, obstacle.w, obstacle.h);
        document.getElementById("score").innerText = "คะแนน: " + score;
    }

    // แก้จุด Delay: ใช้ event 'touchstart' สำหรับมือถือ และ 'keydown' สำหรับคอม
    function jump() {
        if (player.grounded) {
            player.dy = -12; // แรงกระโดด
            player.grounded = false;
        }
    }

    window.addEventListener("touchstart", jump);
    window.addEventListener("keydown", (e) => { if(e.code === "Space") jump(); });

    update();
            </script>
