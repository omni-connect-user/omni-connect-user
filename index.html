<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniConnect</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f0f2f5; }
        .login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 9999; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .login-box { width: 100%; max-width: 400px; text-align: center; }
        .main-content { padding: 20px; }
        /* ใส่ CSS เดิมที่เคยใช้ตรงนี้ */
    </style>
</head>
<body>

    <!-- หน้าต่าง Login -->
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h2>OmniConnect</h2>
            <input type="email" id="emailInput" placeholder="อีเมล" style="width:100%; padding:10px; margin:10px 0;">
            <input type="password" id="passwordInput" placeholder="รหัสผ่าน" style="width:100%; padding:10px; margin:10px 0;">
            <button onclick="handleLogin()" style="width:100%; padding:10px; background:#1877f2; color:white; border:none;">เข้าสู่ระบบ</button>
        </div>
    </div>

    <!-- ส่วนเนื้อหาเว็บ -->
    <div class="main-content">
        <div class="logo" style="color:#1877f2; font-size:24px; font-weight:bold; margin-bottom:20px;">OmniConnect</div>
        <textarea id="postInput" placeholder="โพสต์อะไรหน่อย..." style="width:100%; height:60px;"></textarea>
        <button onclick="sendPost()" style="width:100%; padding:10px; background:#1877f2; color:white; border:none;">โพสต์</button>
        <div id="feed"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://razrwpmqnqohpetlkpiw.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhenJ3cG1xbnFvaHBldGxrcGl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyOTk2MjUsImV4cCI6MjEwMjg3NTYyNX0.3n8lnroMGKssSHUqRneh7M9uyd1dSxymraZHzwXhhuk";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function checkUserSession() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                document.getElementById('loginScreen').style.display = 'none';
                loadPosts();
            }
        }

        async function handleLogin() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const { error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) {
                await _supabase.auth.signUp({ email, password });
                alert("สมัครสมาชิกสำเร็จ!");
            }
            location.reload();
        }

        async function loadPosts() {
            const { data: posts } = await _supabase.from('posts').select('*');
            document.getElementById('feed').innerHTML = (posts || []).map(p => `<div>${p.content}</div>`).join('');
        }

        async function sendPost() {
            const content = document.getElementById('postInput').value;
            await _supabase.from('posts').insert([{ content: content }]);
            loadPosts();
        }

        checkUserSession();
    </script>
</body>
</html>
