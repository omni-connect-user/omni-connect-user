<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniConnect - Video Support</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f0f2f5; color: #1c1e21; padding-bottom: 40px; }
        header { background: #ffffff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e4e6eb; position: sticky; top: 0; z-index: 100; }
        .logo { color: #1877f2; font-size: 22px; font-weight: bold; }
        .container { max-width: 500px; margin: 0 auto; padding: 12px; }

        /* Media styles */
        .media-content { width: 100%; border-radius: 8px; margin-bottom: 10px; display: block; background: #000; }
        
        /* Other styles (Profile, Feed, etc.) */
        .profile-card { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 12px; }
        .profile-avatar { width: 50px; height: 50px; border-radius: 50%; background: #1877f2; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; overflow: hidden; flex-shrink: 0; }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-info { flex: 1; }
        .profile-info input { width: 100%; border: 1px solid #e4e6eb; padding: 6px 10px; border-radius: 6px; font-size: 14px; font-weight: bold; outline: none; margin-bottom: 4px; }
        .profile-avatar-upload { font-size: 11px; color: #65676b; cursor: pointer; }

        .stories-wrapper { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .stories-title { font-size: 14px; font-weight: bold; color: #65676b; margin-bottom: 8px; }
        .stories-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
        .story-item { flex: 0 0 80px; height: 120px; border-radius: 10px; background: #e4e6eb; position: relative; cursor: pointer; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px; text-align: center; color: white; font-size: 11px; font-weight: bold; }
        .story-item.add-story { background: #e7f3ff; color: #1877f2; justify-content: center; align-items: center; border: 2px dashed #1877f2; }
        .story-media { position: absolute; top:0; left:0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .story-overlay { position: absolute; top:0; left:0; width: 100%; height: 100%; background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.7)); z-index: 2; }
        .story-author { position: relative; z-index: 3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }

        .story-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
        .story-modal-media { max-width: 90%; max-height: 80vh; border-radius: 8px; }

        .create-post { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .create-post textarea { width: 100%; border: none; resize: none; outline: none; font-size: 15px; min-height: 60px; }
        .file-input-wrapper { margin-top: 8px; font-size: 13px; color: #65676b; }
        .post-btn { background: #1877f2; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; width: 100%; margin-top: 8px; cursor: pointer; }
        .post-btn:disabled { background: #93c5fd; cursor: not-allowed; }

        .feed { display: flex; flex-direction: column; gap: 12px; }
        .post-card { background: #fff; border-radius: 12px; padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #1877f2; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; overflow: hidden; }
        .post-author { font-weight: bold; font-size: 14px; }
        .post-content { font-size: 15px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header><div class="logo">OmniConnect</div></header>

    <div class="container">
        <!-- Profile Box -->
        <div class="profile-card">
            <div class="profile-avatar" id="myAvatarDisplay">U</div>
            <div class="profile-info">
                <input type="text" id="myAuthorInput" placeholder="ชื่อโปรไฟล์...">
            </div>
        </div>

        <!-- Stories -->
        <div class="stories-wrapper">
            <div class="stories-title">สตอรี่</div>
            <div class="stories-container" id="storiesContainer">
                <div class="story-item add-story" onclick="document.getElementById('storyFileInput').click()">
                    <div style="font-size:24px;">+</div><input type="file" id="storyFileInput" accept="image/*,video/*" style="display:none;" onchange="uploadStory(this)">
                </div>
            </div>
        </div>

        <!-- Post -->
        <div class="create-post">
            <textarea id="postInput" placeholder="คุณกำลังคิดอะไรอยู่?"></textarea>
            <div class="file-input-wrapper">📷/🎬 เพิ่มสื่อ: <input type="file" id="mediaInput" accept="image/*,video/*"></div>
            <button class="post-btn" id="postBtn" onclick="sendPost()">โพสต์</button>
        </div>

        <div class="feed" id="feed"></div>
    </div>

    <div class="story-modal" id="storyModal" onclick="closeStoryModal()">
        <div class="story-modal-media" id="storyModalMediaContainer"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://razrwpmqnqohpetlkpiw.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhenJ3cG1xbnFvaHBldGxrcGl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyOTk2MjUsImV4cCI6MjEwMjg3NTYyNX0.3n8lnroMGKssSHUqRneh7M9uyd1dSxymraZHzwXhhuk";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Helper: ตรวจสอบว่าเป็นวิดีโอหรือไม่
        function isVideo(url) {
            return url && url.match(/\.(mp4|mov|webm|ogg)/i);
        }

        // Helper: สร้าง HTML สำหรับแสดงสื่อ
        function getMediaHtml(url, className = "media-content") {
            if (isVideo(url)) {
                return `<video src="${url}" controls class="${className}"></video>`;
            }
            return `<img src="${url}" class="${className}">`;
        }

        async function loadPosts() {
            const { data: posts } = await _supabase.from('posts').select('*').order('created_at', { ascending: false });
            const feed = document.getElementById('feed');
            feed.innerHTML = (posts || []).map(post => `
                <div class="post-card">
                    <div class="post-header"><div class="avatar">${(post.author || 'U')[0]}</div><strong>${post.author || 'User'}</strong></div>
                    <div class="post-content">${post.content || ''}</div>
                    ${post.image_url ? getMediaHtml(post.image_url) : ''}
                </div>
            `).join('');
        }

        async function sendPost() {
            const input = document.getElementById('postInput');
            const fileInput = document.getElementById('mediaInput');
            const file = fileInput.files[0];
            const btn = document.getElementById('postBtn');
            const author = document.getElementById('myAuthorInput').value || 'User';
            
            if (!input.value && !file) return;

            btn.disabled = true;
            btn.innerText = "กำลังอัปโหลด... กรุณารอสักครู่ (วิดีโออาจใช้เวลาสักครู่)";

            let imageUrl = null;
            try {
                if (file) {
                    const fileName = `${Date.now()}_${file.name}`;
                    const { data, error } = await _supabase.storage.from('post-images').upload(fileName, file);
                    
                    if (error) throw error;

                    const { data: urlData } = _supabase.storage.from('post-images').getPublicUrl(data.path);
                    imageUrl = urlData.publicUrl;
                }

                await _supabase.from('posts').insert([{ content: input.value, author: author, image_url: imageUrl }]);
                
                input.value = '';
                fileInput.value = '';
                loadPosts();
            } catch (err) {
                alert("เกิดข้อผิดพลาดในการอัปโหลด: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "โพสต์";
            }
        }

        async function uploadStory(input) {
            const file = input.files[0];
            if (!file) return;
            const author = document.getElementById('myAuthorInput').value || 'User';
            const fileName = `${Date.now()}_${file.name}`;
            
            const { data, error } = await _supabase.storage.from('post-images').upload(fileName, file);
            if (error) return alert("อัปโหลดสตอรี่ไม่สำเร็จ: " + error.message);
            
            const { data: urlData } = _supabase.storage.from('post-images').getPublicUrl(data.path);
            await _supabase.from('stories').insert([{ author: author, media_url: urlData.publicUrl }]);
            loadStories();
        }

        async function loadStories() {
            const { data: stories } = await _supabase.from('stories').select('*');
            const container = document.getElementById('storiesContainer');
            const addBtn = `<div class="story-item add-story" onclick="document.getElementById('storyFileInput').click()">+<input type="file" id="storyFileInput" accept="image/*,video/*" style="display:none;" onchange="uploadStory(this)"></div>`;
            
            container.innerHTML = addBtn + (stories || []).map(s => `
                <div class="story-item" onclick="viewStory('${s.media_url}')">
                    ${isVideo(s.media_url) ? `<video src="${s.media_url}" class="story-media"></video>` : `<img src="${s.media_url}" class="story-media">`}
                    <div class="story-overlay"></div>
                    <div class="story-author">${s.author || 'User'}</div>
                </div>
            `).join('');
        }

        function viewStory(url) {
            const modal = document.getElementById('storyModal');
            document.getElementById('storyModalMediaContainer').innerHTML = getMediaHtml(url, "story-modal-media");
            modal.style.display = 'flex';
        }
        
        function closeStoryModal() { document.getElementById('storyModal').style.display = 'none'; }

        loadPosts();
        loadStories();
    </script>
</body>
</html>
