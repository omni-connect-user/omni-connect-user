<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jump Master!</title>
    <style>
        body { text-align: center; font-family: Arial, sans-serif; background-color: #f0f2f5; margin-top: 50px; }
        h1 { color: #333; }
        canvas { background: linear-gradient(to bottom, #87CEEB, #e0f6ff); border: 3px solid #333; display: block; margin: 20px auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #score { font-size: 20px; font-weight: bold; color: #1877f2; }
    </style>
</head>
<body>

    <h1>Jump Master!</h1>
    <p>แตะที่หน้าจอหรือกด Spacebar เพื่อกระโดด!</p>
    
    <canvas id="gameCanvas" width="400" height="200"></canvas>
    <div id="score">คะแนน: 0</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        let player = { x: 50, y: 140, w: 30, h: 40, dy: 0, grounded: true };
        let obstacle = { x: 400, y: 145, w: 20, h: 35 };
        let score = 0;
        let gameSpeed = 6;

        function update() {
            player.dy += 0.8; 
            player.y += player.dy;

            if (player.y > 140) {
                player.y = 140;
                player.dy = 0;
                player.grounded = true;
            }

            obstacle.x -= gameSpeed;
            if (obstacle.x < -20) {
                obstacle.x = canvas.width;
                score++;
                gameSpeed += 0.1; 
            }

            // เช็กชน
            if (player.x < obstacle.x + obstacle.w && 
                player.x + player.w > obstacle.x && 
                player.y + player.h > obstacle.y) {
                alert("Game Over! คะแนนของคุณ: " + score);
                score = 0;
                gameSpeed = 6;
                obstacle.x = canvas.width;
            }

            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // วาดพื้นดิน
            ctx.fillStyle = "#4CAF50";
            ctx.fillRect(0, 180, canvas.width, 20);

            // === โมเดลตัวละคร (เจ้าตัวจิ๋วสุดเท่) ===
            // 1. ตัวเสื้อ
            ctx.fillStyle = "#ff5722";
            ctx.fillRect(player.x, player.y + 15, player.w, 25);
            
            // 2. หัว (ผิวตัวละคร)
            ctx.fillStyle = "#ffccbc";
            ctx.fillRect(player.x + 5, player.y, 20, 18);
            
            // 3. ตา
            ctx.fillStyle = "#000";
            ctx.fillRect(player.x + 15, player.y + 5, 4, 4);

            // === โมเดลอุปสรรค (กล่องหนาม/สิ่งกีดขวาง) ===
            ctx.fillStyle = "#795548";
            ctx.fillRect(obstacle.x, obstacle.y, obstacle.w, obstacle.h);
            ctx.fillStyle = "#d7ccc8";
            ctx.fillRect(obstacle.x + 4, obstacle.y + 4, 12, 10);
            
            document.getElementById("score").innerText = "คะแนน: " + score;
        }

        function jump() {
            if (player.grounded) {
                player.dy = -12;
                player.grounded = false;
            }
        }

        window.addEventListener("touchstart", (e) => { e.preventDefault(); jump(); }, { passive: false });
        window.addEventListener("mousedown", jump);
        window.addEventListener("keydown", (e) => { if(e.code === "Space") jump(); });

        update();
    </script>
</body>
</html>
